<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">


<head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="assets/images/favicon.ico" />
    <link rel="stylesheet" href="assets/stylesheets/style.css" />
    <script src="https://kit.fontawesome.com/c8e4d183c2.js" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="assets/javascripts/script.js" defer></script>
    <script src="assets/javascripts/index.js" defer></script>
    <title>David Bragg</title>
</head>
<body>
    <section id="landing__page" onmousemove="moveBackground(event)">
        <nav>
            <figure>
                <img src="assets/images/logo.svg" alt="" id="personal-logo">
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link" onclick="toggleModal()">
                    <a href="#" class="
                 nav__link--anchor
                 link__hover-effect
                 link__hover-effect--black
                 ">About</a>
                </li>
                <li class="nav__link" onclick="toggleModal()">
                    <a href="#" class="
                 nav__link--anchor
                 link__hover-effect
                 link__hover-effect--black
                 ">Projects</a>
                </li>
                <li class="nav__link" onclick="toggleModal()">
                    <a href="#" class="
                 nav__link--anchor
                 link__hover-effect
                 link__hover-effect--black
                 ">Contact</a>
                </li>
                <li class="nav__link click" onclick="toggleContrast()">
                    <a href="#" class="
                       nav__link--anchor
                       link__hover-effect
                 link__hover-effect--black
                 "><i class="fas fa-adjust"></i></a>
                </li>
            </ul>
        </nav>
        <header class="header">
            <div class="header__content">
                <h1 class="title">Hey</h1>
                <h1 class="title orange">I'm David</h1>
                <p class="header__para">
                    I'm a <b class="orange">Frontend Software Engineer</b> with a strong passion for building web applications with great user experiences.
                    <br>Here's a bit more <b class="orange click">about me</b>
                </p>
            </div>
        </header>
    </section>
    <div id="demo"></div>
</body>
</html>
